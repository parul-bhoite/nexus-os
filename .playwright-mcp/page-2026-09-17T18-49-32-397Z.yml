          - heading "Fetched or calculated. Never guessed." [level=3] [ref=f8e882]
          - paragraph [ref=f8e883]: Every figure you see is pulled from a connected source or computed deterministically in code. The AI interprets and phrases; it does not estimate.
        - generic [ref=f8e891]:
          - heading "Confidence is computed, not written." [level=3] [ref=f8e892]
          - paragraph [ref=f8e893]: Confidence percentages, financial exposure and churn risk come from defined formulas in the backend. A language model never produces the figure.
        - generic [ref=f8e901]:
          - heading "Every proposal price is cited." [level=3] [ref=f8e902]
          - paragraph [ref=f8e903]: Prices are retrieved from your own uploaded price list with a reference to the document and page. If a price is not found, you get a visible placeholder — never a plausible number.
