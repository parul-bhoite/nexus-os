          - heading "Fetched or calculated. Never guessed." [level=3] [ref=f24e808]
          - paragraph [ref=f24e809]: Every figure you see is pulled from a connected source or computed deterministically in code. The AI interprets and phrases; it does not estimate.
        - generic [ref=f24e817]:
          - heading "Confidence is computed, not written." [level=3] [ref=f24e818]
          - paragraph [ref=f24e819]: Confidence percentages, financial exposure and churn risk come from defined formulas in the backend. A language model never produces the figure.
        - generic [ref=f24e827]:
          - heading "Every proposal price is cited." [level=3] [ref=f24e828]
          - paragraph [ref=f24e829]: Prices are retrieved from your own uploaded price list with a reference to the document and page. If a price is not found, you get a visible placeholder — never a plausible number.
        - generic [ref=f24e837]:
          - heading "Missing data shows as missing." [level=3] [ref=f24e838]
          - paragraph [ref=f24e839]: No connected analytics means the marketing score says so. You get a visible gap and a prompt to connect the source, not a confident-sounding guess.
        - generic [ref=f24e847]:
          - heading "Every card can answer “why?”" [level=3] [ref=f24e848]
          - paragraph [ref=f24e849]: Each insight stores the input data and the calculation behind it, so any recommendation can show its working.
        - paragraph [ref=f24e851]: This is not marketing language. It is enforced as a per-module engineering contract with an automated test suite that runs on every change.
